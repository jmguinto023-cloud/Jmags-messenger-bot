name: JMAGS Hybrid AI tests
on:
  push:
    branches:
      - feature/jmags-hybrid-gemini-groq
      - policy/shop-checkup-300-20261021
      - fix/home-visit-checkup-1000
      - test/private-conversation-simulator
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --test test/ai-router.test.js test/quick-replies.test.js test/ai-smoke-test.test.js test/messenger-test.test.js test/private-test-chat.test.js test/home-visit-fee.test.js test/checkup-policy.test.js
      - run: npm test
