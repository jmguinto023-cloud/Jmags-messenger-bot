name: JMAGS video AI safety tests
on:
  pull_request:
    paths:
      - 'src/video-*.js'
      - 'test/video-*.test.js'
      - 'Dockerfile.video-vision'
      - '.github/workflows/video-vision-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-video-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated FFmpeg dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run unit, security, and end-to-end simulated video analysis tests
        run: node --test test/video-diagnosis.test.js test/video-frame-extractor.test.js test/video-review.test.js test/video-end-to-end.test.js
