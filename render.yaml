# Render Blueprint – one always-on web service (Starter plan, US$7/month) + 1 GB disk
# (US$0.25/GB/month) so chat history and handoff status survive restarts and deploys.
# sync: false keys are owned in the Render dashboard. A blueprint sync must not
# overwrite them. Leave them without a value. Code defaults apply when unset.
services:
  - type: web
    name: jmags-messenger-bot
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: BOT_ENABLED
        sync: false
      - key: BOT_TEST_PSIDS
        sync: false
      # Empty means always on. Startup logs hours=24/7. Code default timezone is Asia/Manila.
      - key: BOT_ACTIVE_HOURS
        sync: false
      # Empty means reply whenever BOT_ENABLED is on. Example night window: 22:00-07:00
      - key: BOT_SCHEDULE
        sync: false
      - key: BOT_ALWAYS_ON_DAYS
        sync: false
      - key: BOT_TIMEZONE
        sync: false
      - key: BATCH_WINDOW_MS
        sync: false
      - key: REPLY_WINDOW_HOURS
        sync: false
      - key: HISTORY_TURNS
        sync: false
      - key: HUMAN_PAUSE_HOURS
        sync: false
      # Pause length after a human reply. Empty keeps the code default (30 minutes).
      - key: HUMAN_PAUSE_MINUTES
        sync: false
      # Customer message during a human pause is answered after this quiet staff gap. Empty keeps 5 minutes.
      - key: STAFF_GRACE_MINUTES
        sync: false
      - key: HANDOFF_RESUME_HOURS
        sync: false
      - key: FOLLOWUP_AFTER_MIN
        sync: false
      - key: FOLLOWUP_MAX
        sync: false
      # Empty keeps the code default (6 hours). Older chats are not nudged.
      - key: FOLLOWUP_MAX_AGE_HOURS
        sync: false
      - key: VIDEO_FOLLOWUP_MINUTES
        sync: false
      - key: VIDEO_FOLLOWUP2_MINUTES
        sync: false
      # Off until the sample morning message is approved. Empty keeps the code default (off).
      - key: DAILY_STATUS_UPDATES
        sync: false
      # One ready-for-delivery text. Empty keeps the code default (off).
      - key: DELIVERY_NOTIFICATIONS
        sync: false
      - key: DATA_RETENTION_DAYS
        sync: false
      - key: BOOKING_FORM_URL
        sync: false
      - key: HANDOFF_KEYWORDS
        sync: false
      - key: IGNORE_ECHO_APP_IDS
        sync: false
      # Empty until the Meta automation app id is confirmed. Does not pause the bot.
      - key: PAGE_AI_APP_IDS
        sync: false
      - key: LOG_LEVEL
        sync: false
      - key: VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DASHBOARD_PASSWORD
        generateValue: true
      # Optional replacement for the one-time free-tips message. Empty uses the built-in text.
      - key: TIPS_MESSAGE
        sync: false
      - key: APP_ID
        sync: false
      - key: APP_SECRET
        sync: false
      - key: PAGE_ID
        value: "102622881557025"
      - key: PAGE_ACCESS_TOKEN
        sync: false
      - key: GRAPH_API_VERSION
        value: v26.0
      - key: PAGE_INBOX_APP_ID
        value: "263902037430900"
      - key: NEEDS_IVAN_LABEL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_MS
        sync: false
      - key: LLM_TEMPERATURE
        sync: false
      - key: LLM_MAX_TOKENS
        sync: false
      # Empty keeps the code default (8 requests per minute). 0 turns the gap off.
      - key: LLM_MAX_RPM
        sync: false
      # Empty keeps SMS off. Turn on in the dashboard only after Semaphore is ready.
      - key: SMS_ENABLED
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false
      # Empty keeps JMAGS. DEFAULT or none omits sendername until that name is approved.
      - key: SMS_SENDER_NAME
        sync: false
      - key: SMS_CONFIRM_TEMPLATE
        sync: false
      - key: SMS_INBOUND_TOKEN
        sync: false
